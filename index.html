<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Icônes livrées avec le produit : le favicon SVG portait encore
         l'ancienne marque bxChange. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icone-bxflow-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icone-bxflow-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icone-bxflow-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Constantes du site, valables quelle que soit la page. -->
    <meta property="og:site_name" content="bxFlow" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:image:alt"
      content="bxFlow — vos processus métier, modélisés puis exécutés tout seuls"
    />

    <!-- ══ Tête propre à la page ══

         Tout ce qui se trouve entre ces deux repères est REMPLACÉ page par page
         par `scripts/prerender.mjs`, à partir des balises que `Seo.tsx` produit
         au rendu. Les valeurs écrites ici sont donc celles de l'accueil, et
         elles servent dans les deux seuls cas où le prérendu ne s'applique
         pas : le serveur de développement, et une adresse inconnue servie par
         le repli de Cloudflare.

         Elles sont EN DUR pour une raison qui n'a pas changé : LinkedIn,
         WhatsApp et Slack n'exécutent pas le JavaScript. Avant le prérendu,
         c'était la seule tête qu'ils voyaient — et `twitter:card` promettait
         une grande image sans qu'aucune n'existe, donc une carte vide.

         NE PAS retirer les repères : le prérendu échoue s'il ne les trouve
         plus, plutôt que d'écrire vingt-deux pages portant toutes le titre de
         l'accueil. -->
    <!--tete-par-page-->
    <title>bxFlow — Modélisez vos processus métier, ils s’exécutent tout seuls</title>
    <meta
      name="description"
      content="Moteur de processus métier : dessinez les étapes, les rôles et les validations, bxFlow fait avancer chaque dossier. Plus de 70 processus prêts à démarrer."
    />
    <link rel="canonical" href="https://bxgroup.io/fr" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://bxgroup.io/fr" />
    <meta
      property="og:title"
      content="bxFlow — Modélisez vos processus métier, ils s’exécutent tout seuls"
    />
    <meta
      property="og:description"
      content="Dessinez les étapes, les rôles et les validations, bxFlow fait avancer chaque dossier. Plus de 70 processus prêts à démarrer."
    />
    <meta property="og:image" content="https://bxgroup.io/apercu-social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bxgroup.io/apercu-social.png" />
    <!--/tete-par-page-->

    <!-- Données structurées : ce qu'un moteur retient de l'entité elle-même,
         indépendamment de la page visitée. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "bxFlow",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://bxgroup.io",
        "description": "Moteur de processus métier : modélisation des étapes, rôles et validations, exécution automatique des dossiers.",
        "inLanguage": ["fr", "en"],
        "publisher": {
          "@type": "Organization",
          "name": "bxGroup",
          "url": "https://bxgroup.io",
          "logo": "https://bxgroup.io/icone-bxflow-512.png"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
