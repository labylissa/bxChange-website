<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Icônes livrées avec le produit : le favicon SVG portait encore
         l'ancienne marque bxChange. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icone-bxflow-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icone-bxflow-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icone-bxflow-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Polices servies par le site (plus aucun appel à Google Fonts : ni adresse IP transmise, ni connexion en plus). -->
    <link rel="preload" href="/polices/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/polices/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Constantes du site, valables quelle que soit la page. -->
    <meta property="og:site_name" content="bxFlow" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:image:alt"
      content="bxFlow — vos processus métier, sous contrôle de bout en bout"
    />

    <!-- ══ Tête propre à la page ══

         Tout ce qui se trouve entre ces deux repères est REMPLACÉ page par page
         par `scripts/prerender.mjs`, à partir des balises que `Seo.tsx` produit
         au rendu. Les valeurs écrites ici sont donc celles de l'accueil, et
         elles servent dans les deux seuls cas où le prérendu ne s'applique
         pas : le serveur de développement, et une adresse inconnue servie par
         le repli de Cloudflare.

         Elles sont EN DUR pour une raison qui n'a pas changé : LinkedIn,
         WhatsApp et Slack n'exécutent pas le JavaScript. Avant le prérendu,
         c'était la seule tête qu'ils voyaient — et `twitter:card` promettait
         une grande image sans qu'aucune n'existe, donc une carte vide.

         NE PAS retirer les repères : le prérendu échoue s'il ne les trouve
         plus, plutôt que d'écrire vingt-deux pages portant toutes le titre de
         l'accueil. -->
    <!--tete-par-page-->
    <title>bxFlow — Vos processus métier, sous contrôle de bout en bout</title>
    <meta
      name="description"
      content="Moteur de processus métier pour la banque, l’assurance et l’entreprise : KYC, LCB-FT, sinistres, achats. Plus de 70 processus prêts à l’emploi, hébergés ou installés sur vos serveurs."
    />
    <link rel="canonical" href="https://bxgroup.io/fr/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://bxgroup.io/fr/" />
    <meta
      property="og:title"
      content="bxFlow — Vos processus métier, sous contrôle de bout en bout"
    />
    <meta
      property="og:description"
      content="KYC, LCB-FT, sinistres, achats : chaque dossier suit ses étapes et ses validations, avec un historique qui fait foi. Plus de 70 processus prêts à l’emploi."
    />
    <meta property="og:image" content="https://bxgroup.io/apercu-social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bxgroup.io/apercu-social.png" />

    <meta name="author" content="Boly SENE" />

    <!-- Données structurées : ce qu'un moteur retient de l'entité bxFlow
         elle-même. DANS le repère de tête, donc REMPLACÉ page par page comme
         le reste — chaque page l'engendre dans sa propre langue via
         `Seo.tsx` (`BXFLOW_ID`). Les valeurs ici sont celles du français, au
         même titre que le titre et la description ci-dessus : le repli des
         deux seuls cas où le prérendu ne s'applique pas. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "@id": "https://bxgroup.io/#bxflow",
        "name": "bxFlow",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://bxgroup.io",
        "description": "Moteur de processus métier : modélisation des étapes, rôles et validations, exécution automatique des dossiers.",
        "inLanguage": "fr",
        "author": { "@id": "https://bxgroup.io/fr/equipe/#boly-sene" },
        "creator": { "@id": "https://bxgroup.io/fr/equipe/#boly-sene" },
        "publisher": { "@id": "https://bxgroup.io/#organisation" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://bxgroup.io/fr/equipe/#boly-sene",
            "name": "Boly SENE",
            "jobTitle": "Fondateur, architecte logiciel",
            "description": "Développeur full stack de formation, architecte aujourd'hui : plus de 8 ans de développement logiciel et 5 ans de conception de workflows. Il porte la vision produit et les choix technologiques de bxFlow.",
            "image": "https://bxgroup.io/equipe/boly.webp",
            "url": "https://bxgroup.io/fr/equipe/",
            "worksFor": { "@id": "https://bxgroup.io/#organisation" }
          },
          {
            "@type": "Organization",
            "@id": "https://bxgroup.io/#organisation",
            "name": "bxGroup",
            "url": "https://bxgroup.io",
            "logo": "https://bxgroup.io/icone-bxflow-512.png",
            "founder": { "@id": "https://bxgroup.io/fr/equipe/#boly-sene" },
            "sameAs": ["https://www.linkedin.com/company/bxgroup-horizon"]
          }
        ]
      }
    </script>
    <!--/tete-par-page-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
